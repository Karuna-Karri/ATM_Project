  
<!DOCTYPE html> 
<html lang="en"> 
<head> 
   <meta charset="UTF-8"> 
   <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
   <title>ATM Login</title>
   <style> 
        body { 
             display: flex; 
             justify-content: center; 
             align-items: center; 
             height: 100vh; 
             background-color: #f4f4f4; 
             font-family: Arial, sans-serif; 
             margin: 0; 
         } 
        .container { 
             text-align: center; 
             background: white; 
             padding: 30px; 
             border-radius: 10px; 
             box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2); 
             width: 300px;
         } 
         h1 { 
             color: #333; 
             margin-bottom: 20px; 
        } 
        .input-group { 
             text-align: left;
             margin-bottom: 15px; 
        } 
        .input-group label { 
             display: block; 
             font-weight: bold; 
             margin-bottom: 5px; 
             color: #333; 
        } 
        .input-field { 
             width: 100%; 
             padding: 10px; 
             border: 1px solid #ccc; 
             border-radius: 5px; 
             font-size: 16px;
         } 
         .btn { 
             padding: 10px 20px; 
             font-size: 18px; 
             color: white; 
             background: #007bff; 
             border: none; 
             border-radius: 5px; 
             cursor: pointer; 
             text-decoration: none; 
             width: 50%;
         } 
       .btn:hover { 
            background: #0056b3; 
        } 
   </style> 
</head> 
<body> 
    <div class="container"> 
      <h1>Enter The Details </h1> 
      <form action="index.html">
          <div class="input-group">
              <label for="atmNumber">Enter ATM Number</label>
              <input type="text" id="atmNumber" name="atmNumber" class="input-field" required>
          </div>
          <div class="input-group">
              <label for="atmPin">Enter PIN</label>
              <input type="password" id="atmPin" name="atmPin" class="input-field" required>
          </div>
          <button type="submit" class="btn">Submit </button>
      </form>
    </div> 
</body> 
</html>
