 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM System</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            width: 350px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 45px;  /* Same height for buttons & anchors */
            font-size: 16px;
            color: white;
            background: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            padding: 10px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        /* Ensure anchor behaves exactly like a button */
        .btn-link {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 16px;
            color: white;
            background: #007bff;
            border-radius: 5px;
            width: 100%;
            height: 45px;
        }
        .btn-link:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Select The Option </h2>
        <form action="AtmServlet" method="post">
            <div class="btn-container">
                <button type="submit" class="btn" name="action" value="View Balance">View Balance</button>
                <a href="withdraw.html" class="btn-link">Withdraw</a>
                <a href="deposit.html" class="btn-link">Deposit</a>
                <button type="submit" class="btn" name="action" value="Mini Statement">Mini Statement</button>
            </div>
        </form>
    </div>
</body>
</html>
